<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="title">周易占卜</title>
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<main>
  <header>
    <button id="lang" class="lang ghost" aria-label="繁簡切換">简</button>
    <h1 data-t="title">周易占卜</h1>
    <p class="sub" data-t="sub">文王六十四卦</p>
  </header>

  <nav id="methods" role="tablist">
    <button data-method="coins" data-t="m_coins">三錢法</button>
    <button data-method="yarrow" data-t="m_yarrow">蓍草法</button>
    <button data-method="meihua" data-t="m_meihua">梅花易數</button>
  </nav>
  <p id="method-desc" class="desc"></p>

  <section id="ask">
    <input id="question" data-t-placeholder="ask" placeholder="心中默念所問之事（可不填）" maxlength="60">
    <div class="buttons">
      <button id="toss">擲錢</button>
      <button id="auto" class="ghost" data-t="auto">一次起卦</button>
      <button id="reset" class="ghost" hidden data-t="reset">重新起卦</button>
    </div>
    <div id="process" aria-live="polite"></div>
    <p id="progress"></p>
  </section>

  <section id="board">
    <div class="hex" id="ben"></div>
    <div class="arrow" id="arrow" hidden>→</div>
    <div class="hex" id="zhi" hidden></div>
  </section>

  <section id="reading" hidden></section>

  <section id="history">
    <h2><span data-t="history">起卦記錄</span> <button id="clear-history" class="link" data-t="clear">清空</button></h2>
    <ol id="history-list"></ol>
    <p id="history-empty" class="desc" data-t="historyEmpty">尚無記錄</p>
  </section>
</main>
<script src="web/app.js"></script>
</body>
</html>
