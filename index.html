<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周易占卜</title>
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<main>
  <header>
    <h1>周易占卜</h1>
    <p class="sub">三錢法起卦 · 文王六十四卦</p>
  </header>

  <section id="ask">
    <input id="question" placeholder="心中默念所問之事（可不填）" maxlength="60">
    <div class="buttons">
      <button id="toss">擲錢</button>
      <button id="auto" class="ghost">一次起卦</button>
      <button id="reset" class="ghost" hidden>重新起卦</button>
    </div>
    <div id="coins" aria-live="polite"></div>
    <p id="progress"></p>
  </section>

  <section id="board">
    <div class="hex" id="ben"></div>
    <div class="arrow" id="arrow" hidden>→</div>
    <div class="hex" id="zhi" hidden></div>
  </section>

  <section id="reading" hidden></section>
</main>
<script src="web/app.js"></script>
</body>
</html>
